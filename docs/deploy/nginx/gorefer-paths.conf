# T-162 — nginx paths under the RELEASE-DIRECTORY layout.
#
# Include this inside the gorefer.in :443 server block (or copy the two location
# blocks into it), replacing any `root`/`alias` that still points at the old flat
# /var/www/gorefer app directory.
#
# WHY STATIC POINTS AT shared/, NOT current/:
#   collectstatic writes into $ROOT/shared/staticfiles, which every release symlinks in
#   as ./staticfiles. Serving that path directly means nginx never has to follow the
#   `current` symlink and never caches a resolved path that a deploy then invalidates.
#   A release flip changes what the APP serves; the static directory is the same
#   directory before and after, already containing the new release's assets (they were
#   collected before the flip).
#
# The app itself is reached over the loopback port from gunicorn (systemd unit
# docs/deploy/systemd/gorefer.service), so nginx needs no app path at all — which is
# exactly why a release flip needs no nginx reload.

location /static/ {
    alias /var/www/gorefer/shared/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

location / {
    # Cloudflare-only origin lock (see cloudflare-allow.conf + README.md).
    include /etc/nginx/snippets/cloudflare-allow.conf;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
