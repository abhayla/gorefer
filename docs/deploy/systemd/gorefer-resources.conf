# T-162 (owner-approved point 25) — resource fence for gorefer.service (the web app).
#
# WHY: gorefer.in shares <PROD-VPS> with firekaro / realfuelprices /
# bestdemataccount / calculatekaro AND the Postgres that GoRefer itself depends on. A
# GoRefer memory leak or a runaway request today has no ceiling: the kernel OOM killer
# picks a victim by score, and the biggest process on the box is usually Postgres. So a
# GoRefer bug can take down the DATABASE and the neighbouring sites. This drop-in makes
# the blast radius GoRefer's own: it gets throttled or killed, nothing else does.
#
# --- WHERE THE NUMBERS COME FROM (read before changing them) ---
# These are STARTING values reasoned from the shape of the service, NOT from a live
# measurement — the worker that authored this file is barred from touching the VPS.
#   * gunicorn runs 3 sync workers of this Django app. A Django worker of this size
#     (Django + Ninja + psycopg + requests, no ML/no pandas) sits at roughly 120-200 MB
#     RSS steady-state; 3 workers + the master ~= 500-700 MB.
#   * MemoryHigh=768M throttles (reclaim pressure) before anything dies; MemoryMax=1G is
#     the hard stop, ~40% above the expected steady-state ceiling, so only a genuine
#     leak or a pathological request reaches it.
#   * CPUQuota=150% = 1.5 cores: enough for a burst across 3 workers, not enough to
#     starve Postgres and the co-tenant sites.
#
# MEASURE, THEN ADJUST — at landing (dispatcher), before/after applying:
#   systemctl show gorefer -p MemoryCurrent -p CPUUsageNSec
#   systemd-cgtop -m --order=memory | head -20
# If MemoryCurrent is regularly within ~30% of MemoryHigh, raise both values rather than
# living next to the ceiling — a fence that fires in normal operation is an outage, not
# a fence. Record any change (value + the measured number behind it) in DEPLOY-TARGET.md.
#
# Apply on <PROD-VPS> — DISPATCHER-OWNED at landing:
#   sudo mkdir -p /etc/systemd/system/gorefer.service.d
#   sudo cp docs/deploy/systemd/gorefer-resources.conf \
#       /etc/systemd/system/gorefer.service.d/resources.conf
#   sudo systemctl daemon-reload && sudo systemctl restart gorefer
#   systemctl show gorefer -p MemoryHigh -p MemoryMax -p CPUQuotaPerSecUSec

[Service]
MemoryHigh=768M
MemoryMax=1G
CPUQuota=150%
# Cap the fork bomb a runaway subprocess loop would otherwise become.
TasksMax=256
