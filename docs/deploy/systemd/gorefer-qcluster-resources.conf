# T-162 (owner-approved point 25) — resource fence for gorefer-qcluster.service.
#
# WHY: the worker is the likelier of the two services to run away. It loops over Zoho
# and Wati HTTP calls, follow-up sweeps and rollup recomputes; a bad payload or an
# unbounded queryset there can grow memory unchecked while nothing serves a page badly
# enough to notice. Unfenced, that ends in the OOM killer choosing Postgres.
#
# --- WHERE THE NUMBERS COME FROM ---
# Same caveat as gorefer-resources.conf: reasoned, not measured (the authoring worker
# never touches the VPS).
#   * django-q runs a small pool of worker processes over the same Django app image;
#     each behaves like a gunicorn worker (~120-200 MB) but with fewer of them and no
#     request concurrency, so steady-state is well under the web tier's.
#   * MemoryHigh=384M throttles first; MemoryMax=512M is the hard stop. Restart=always
#     (T-149) means an OOM kill here self-heals within ~10s instead of silently ending
#     every scheduled job — the fence and the auto-restart are a pair, not alternatives.
#   * CPUQuota=100% = one core. Sweeps are IO-bound (HTTP + DB); one core is plenty and
#     leaves the web tier and Postgres responsive during a big backfill.
#
# MEASURE, THEN ADJUST (dispatcher, at landing):
#   systemctl show gorefer-qcluster -p MemoryCurrent
#   journalctl -u gorefer-qcluster --since -7d | grep -i "killed process\|oom"
# An OOM kill visible in the journal after applying this means the value is too low for
# a real workload (a large Zoho backfill, say) — raise it and record the number.
#
# Apply on <PROD-VPS> — DISPATCHER-OWNED at landing:
#   sudo mkdir -p /etc/systemd/system/gorefer-qcluster.service.d
#   sudo cp docs/deploy/systemd/gorefer-qcluster-resources.conf \
#       /etc/systemd/system/gorefer-qcluster.service.d/resources.conf
#   sudo systemctl daemon-reload && sudo systemctl restart gorefer-qcluster
#   systemctl show gorefer-qcluster -p MemoryHigh -p MemoryMax -p CPUQuotaPerSecUSec

[Service]
MemoryHigh=384M
MemoryMax=512M
CPUQuota=100%
TasksMax=128
