; T-149 — systemd drop-in for gorefer-qcluster.service: auto-restart on crash.
;
; Without this, a qcluster crash/OOM-kill leaves the background worker DEAD until
; someone notices and runs `systemctl restart gorefer-qcluster` by hand — silently
; stopping the Zoho retry/backfill, rollup recompute, WATI delivery reconcile, PII
; purge, and follow-up sweep + inbound poll (every job `setup_schedules` registers).
; `apps.dashboard.health.worker_health()` / `GET /api/health/worker` (T-149) detect
; this AFTER the fact; this drop-in is the fix that stops it recurring.
;
; A DROP-IN (not a full unit replacement) so it survives a future edit to the base
; gorefer-qcluster.service file: only the two directives below are overridden,
; everything else (ExecStart, WorkingDirectory, User, EnvironmentFile, …) stays
; whatever the base unit already has on the box.
;
; --- Apply on the VPS (<PROD-VPS>) — dispatcher-owned at landing, NOT run here ---
;   sudo mkdir -p /etc/systemd/system/gorefer-qcluster.service.d
;   sudo cp docs/deploy/systemd/gorefer-qcluster-restart.conf \
;       /etc/systemd/system/gorefer-qcluster.service.d/restart.conf
;   sudo systemctl daemon-reload
;   sudo systemctl restart gorefer-qcluster
;   systemctl show gorefer-qcluster -p Restart -p RestartUSec   # verify: Restart=always
;
[Service]
Restart=always
RestartSec=10
