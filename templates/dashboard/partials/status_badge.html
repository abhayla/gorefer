{# Reusable status badge. `status` is a GoRefer stage/status string. #}
{% with s=status %}
<span class="inline-block rounded-full px-2.5 py-0.5 text-[10.5px] font-semibold
  {% if s == 'account_opened' or s == 'confirmed' %}bg-emerald-100 text-emerald-700
  {% elif s == 'kyc_started' %}bg-amber-100 text-amber-700
  {% elif s == 'contacted' or s == 'interested' %}bg-blue-100 text-blue-700
  {% elif s == 'rejected' %}bg-red-100 text-red-700
  {% else %}bg-slate-100 text-slate-700{% endif %}">{{ s|default:'—' }}</span>
{% endwith %}
