{% load static %}{% comment %}
Reusable PIFS head: compiled/purged Tailwind CSS + local HTMX (NO CDN runtime).
Light + offline for mobile-first on slow Indian networks (ADR-003). Rebuild the
CSS after template changes: `npm run build:css` (see README).
{% endcomment %}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'css/app.css' %}" />
<script src="{% static 'js/htmx.min.js' %}" defer></script>
<style>body { -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, 'Segoe UI', sans-serif; }</style>
