<!doctype html>
<html lang="en">
<head>
  <title>{% block title %}My Referrals — GoRefer{% endblock %}</title>
  {% include "partials/pifs_head.html" %}
</head>
<body class="bg-bg font-sans text-ink-900 min-h-screen text-[13px]">
  {# Referrer chrome — deliberately NOT the admin topbar (ADR-026: admin chrome hidden). #}
  <header class="bg-white border-b border-line">
    <div class="mx-auto max-w-[1140px] px-5 py-3 flex items-center gap-3">
      <div class="h-7 w-7 rounded-lg bg-cobalt-600 flex items-center justify-center text-white text-[12px] font-extrabold card">G</div>
      <div class="text-[13px] font-bold">My Referrals <span class="text-ink-300 font-medium">· GoRefer by PIFS</span></div>
      <a href="{% url 'referrer_logout' %}" class="ml-auto text-[12px] font-semibold text-ink-500 hover:text-cobalt-600">Sign out</a>
    </div>
  </header>
  <main class="mx-auto max-w-[1140px] px-5 py-5 space-y-4">
    {% block content %}{% endblock %}
    <p class="text-center text-[10px] text-ink-300 pt-1">
      {{ AP_DISCLOSURE_BLOCK }} · {{ MARKET_RISK_WARNING }}
    </p>
  </main>
</body>
</html>
