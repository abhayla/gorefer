<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GoRefer{% endblock %}</title>
  <!-- Tailwind via CDN for the M1 skeleton; a built asset pipeline arrives with M3's UI. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX (loaded now so M3+ partial interactions need no template change). -->
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <main class="mx-auto max-w-xl px-4 py-10">
    {% block content %}{% endblock %}
  </main>
  {% block compliance %}
  <footer class="mx-auto max-w-xl px-4 pb-10 text-xs text-slate-500">
    <p>PIFS — Passive Income Financial Solutions. NSE AP Reg. No. {{ NSE_AP_NO }}.</p>
    <p class="mt-1">Investment in securities market is subject to market risks. Read all the
      related documents carefully before investing.</p>
  </footer>
  {% endblock %}
</body>
</html>
