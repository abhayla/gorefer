name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      # tests/test_qmpref_preferences.py reads this file at runtime (asserts every
      # template name it lists still resolves) — a doc-only edit here can break the
      # suite, so it must never be silently skipped by the blanket docs/** ignore.
      - "!docs/integrations/WhatsApp-Template-Coverage-Matrix.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/integrations/WhatsApp-Template-Coverage-Matrix.md"

# Cancel a superseded run on the same ref (e.g. a PR branch re-pushed before its
# previous CI finished) instead of letting both run to completion — free-tier
# Actions minutes are billed per run, not per "latest run that matters". Never
# cancel a main run in progress: a push to main mid-run must not silently skip
# verification of the commit it superseded — main always finishes what it starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL is the ONLY supported engine (M10) — CI runs against a Postgres
    # service container, not SQLite. The fail-fast guard in settings rejects any
    # other engine, so there is no SQLite job/path to keep green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gorefer
          POSTGRES_PASSWORD: gorefer
          POSTGRES_DB: gorefer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorefer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DJANGO_DEBUG: "false"
      DB_NAME: gorefer
      DB_USER: gorefer
      DB_PASSWORD: gorefer
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_NAME: gorefer_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract-doc gate diffs against the merge base, so it needs history.
          fetch-depth: 0

      - name: Contract-doc drift gate
        # An integration adapter and its contract doc must move together, or the doc
        # rots into fiction the next person trusts. Escape hatch for genuinely
        # doc-irrelevant changes: put [skip-contract-doc] in a commit message.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "contract-doc gate: no usable base ref (first push / new branch) — skipping."
          else
            python scripts/check_contract_docs.py --base "$BASE" --head "${{ github.sha }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package-lock.json is intentionally gitignored (see .gitignore), so
      # setup-node's built-in `cache: npm` has no lockfile to hash — cache the
      # npm download cache directly, keyed on package.json (the closest thing
      # to a dependency manifest this repo commits).
      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build + verify Tailwind CSS is fresh (no CDN runtime)
        run: |
          npm install
          npm run build:css
          git diff --exit-code static/css/app.css \
            || (echo "static/css/app.css is stale — run 'npm run build:css' and commit." && exit 1)

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Architecture boundary gate (rail E-3 — fails only on NEW vendor leaks)
        run: python scripts/check_architecture.py

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate (Postgres)
        run: python manage.py migrate --noinput

      - name: Tests (pytest + coverage floor)
        # T-162 (owner-approved point 26): coverage is now a FLOOR, not just a report.
        # Measured on main at 06cf2bc: 91% (8822/9730 statements covered, 1448 tests).
        # The floor is set to 86 — five points below the measured number — so no existing
        # PR can trip it, while a real drop (deleting tests, merging a large untested
        # module) fails the build instead of quietly eroding the suite.
        # Raise the floor when the measured number rises; never lower it to make a PR pass.
        # `python -m pytest -q` locally still runs exactly as before (no cov flags).
        run: |
          python -m pytest -q \
            --cov=apps --cov=api --cov=gorefer \
            --cov-report=term --cov-report=term-missing:skip-covered \
            --cov-fail-under=86

      - name: Coverage summary
        if: always()
        run: |
          echo "Coverage floor: 86% (measured 91% on main at 06cf2bc, T-162)."
