name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI runs the SQLite path (no external Postgres needed) — see COORDINATION Q-M1-1.
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + verify Tailwind CSS is fresh (no CDN runtime)
        run: |
          npm install
          npm run build:css
          git diff --exit-code static/css/app.css \
            || (echo "static/css/app.css is stale — run 'npm run build:css' and commit." && exit 1)

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: python -m pytest -q
