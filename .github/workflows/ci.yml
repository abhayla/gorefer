name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL is the ONLY supported engine (M10) — CI runs against a Postgres
    # service container, not SQLite. The fail-fast guard in settings rejects any
    # other engine, so there is no SQLite job/path to keep green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gorefer
          POSTGRES_PASSWORD: gorefer
          POSTGRES_DB: gorefer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorefer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      DJANGO_DEBUG: "false"
      DB_NAME: gorefer
      DB_USER: gorefer
      DB_PASSWORD: gorefer
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_NAME: gorefer_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + verify Tailwind CSS is fresh (no CDN runtime)
        run: |
          npm install
          npm run build:css
          git diff --exit-code static/css/app.css \
            || (echo "static/css/app.css is stale — run 'npm run build:css' and commit." && exit 1)

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate (Postgres)
        run: python manage.py migrate --noinput

      - name: Tests (pytest)
        run: python -m pytest -q
